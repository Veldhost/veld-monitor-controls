<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a2d"/>
      <stop offset="0.6" stop-color="#102a4b"/>
      <stop offset="1" stop-color="#0d4f6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#3584e4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3584e4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62d4a4"/>
      <stop offset="1" stop-color="#ffbe6f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <circle cx="1080" cy="72" r="260" fill="#3584e4" opacity="0.08"/>
  <circle cx="1100" cy="540" r="320" fill="#26a269" opacity="0.07"/>

  <g filter="url(#shadow)">
    <image href="icon-512.png" x="76" y="166" width="300" height="300"/>
  </g>

  <text x="428" y="238" font-family="Cantarell, Noto Sans, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Veld Monitor</text>
  <text x="428" y="310" font-family="Cantarell, Noto Sans, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Controls</text>

  <rect x="428" y="344" width="96" height="6" rx="3" fill="url(#accent)"/>

  <text x="428" y="402" font-family="Cantarell, Noto Sans, sans-serif" font-size="29" fill="#d8e4f3">Every external monitor,</text>
  <text x="428" y="440" font-family="Cantarell, Noto Sans, sans-serif" font-size="29" fill="#d8e4f3">right in Quick Settings.</text>

  <g font-family="Cantarell, Noto Sans, sans-serif" font-size="21" fill="#aec4dc">
    <circle cx="438" cy="502" r="4" fill="#62d4a4"/>
    <text x="454" y="509">brightness</text>
    <circle cx="590" cy="502" r="4" fill="#62d4a4"/>
    <text x="606" y="509">contrast</text>
    <circle cx="728" cy="502" r="4" fill="#62d4a4"/>
    <text x="744" y="509">input</text>
    <circle cx="828" cy="502" r="4" fill="#62d4a4"/>
    <text x="844" y="509">color</text>
    <circle cx="938" cy="502" r="4" fill="#62d4a4"/>
    <text x="954" y="509">audio</text>
  </g>

  <text x="428" y="558" font-family="Cantarell, Noto Sans, sans-serif" font-size="20" fill="#7f9bb8">for GNOME 49–51 · DDC/CI · local only</text>
