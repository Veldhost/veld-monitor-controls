name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gjs \
            libglib2.0-bin \
            nodejs \
            jq \
            libxml2-utils \
            unzip \
            zip \
            gnome-shell

      - name: Run checks
        run: make check

      - name: Build release package
        run: make release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: dist/*.zip
          if-no-files-found: error
